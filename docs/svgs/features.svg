<svg viewBox="0 0 1200 380" width="100%" height="340" xmlns="http://www.w3.org/2000/svg">
    <style>
        text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .box-bg { fill: #e6f4ea; stroke: #a7cdb3; stroke-width: 1; }
        .title { font-weight: 700; font-size: 16px; fill: #1a202c; }
        .content { font-size: 13px; fill: #4a5568; }
    </style>

    <g>
        <rect class="box-bg" x="20" y="20" width="570" height="100" rx="6"/>
        <rect x="20" y="20" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="40" y="50">Explicit deletion</text>
        <text class="content" x="40" y="78">Soft-delete and restore records without losing data</text>
        <text class="content" x="40" y="98">Yii’s regular delete still removes rows</text>
    </g>

    <g>
        <rect class="box-bg" x="610" y="20" width="570" height="100" rx="6"/>
        <rect x="610" y="20" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="630" y="50">Query scopes</text>
        <text class="content" x="630" y="78">Select active, deleted or all records</text>
        <text class="content" x="630" y="98">Change the primary table alias without losing the scope</text>
    </g>

    <g>
        <rect class="box-bg" x="20" y="140" width="570" height="100" rx="6"/>
        <rect x="20" y="140" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="40" y="170">Safe delete</text>
        <text class="content" x="40" y="198">Keep rows referenced by immediate foreign keys</text>
        <text class="content" x="40" y="218">Physical delete with transactional soft-delete fallback</text>
    </g>

    <g>
        <rect class="box-bg" x="610" y="140" width="570" height="100" rx="6"/>
        <rect x="610" y="140" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="630" y="170">Lifecycle hooks</text>
        <text class="content" x="630" y="198">Keep model events and optimistic locking</text>
        <text class="content" x="630" y="218">Model hooks can veto deletion or restoration</text>
    </g>

    <g>
        <rect class="box-bg" x="20" y="260" width="570" height="100" rx="6"/>
        <rect x="20" y="260" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="40" y="290">PHP 8.3+</text>
        <text class="content" x="40" y="318">Supports Yii 2.0.55 and Yii 22.0</text>
        <text class="content" x="40" y="338">Works with PHP 8.3 or later</text>
    </g>

    <g>
        <rect class="box-bg" x="610" y="260" width="570" height="100" rx="6"/>
        <rect x="610" y="260" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="630" y="290">Verification</text>
        <text class="content" x="630" y="318">SQLite, MySQL, PostgreSQL, SQL Server and Oracle</text>
        <text class="content" x="630" y="338">Each suite runs on Yii 2.0.55 and Yii 22.0</text>
    </g>
</svg>
