<!-- Mobile version - Single column -->
<svg viewBox="0 0 620 620" width="100%" height="580" xmlns="http://www.w3.org/2000/svg">
    <style>
        text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .box-bg { fill: #e6f4ea; stroke: #a7cdb3; stroke-width: 1; }
        .title { font-weight: 700; font-size: 14px; fill: #1a202c; }
        .content { font-size: 11px; fill: #4a5568; }
    </style>

    <g>
        <rect class="box-bg" x="16" y="16" width="588" height="84" rx="6"/>
        <rect x="16" y="16" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="42">Explicit deletion</text>
        <text class="content" x="32" y="66">Soft-delete and restore records without losing data</text>
        <text class="content" x="32" y="84">Yii’s regular delete still removes rows</text>
    </g>

    <g>
        <rect class="box-bg" x="16" y="116" width="588" height="84" rx="6"/>
        <rect x="16" y="116" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="142">Query scopes</text>
        <text class="content" x="32" y="166">Select active, deleted or all records</text>
        <text class="content" x="32" y="184">Change the primary table alias without losing the scope</text>
    </g>

    <g>
        <rect class="box-bg" x="16" y="216" width="588" height="84" rx="6"/>
        <rect x="16" y="216" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="242">Safe delete</text>
        <text class="content" x="32" y="266">Keep rows referenced by immediate foreign keys</text>
        <text class="content" x="32" y="284">Physical delete with transactional soft-delete fallback</text>
    </g>

    <g>
        <rect class="box-bg" x="16" y="316" width="588" height="84" rx="6"/>
        <rect x="16" y="316" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="342">Lifecycle hooks</text>
        <text class="content" x="32" y="366">Keep model events and optimistic locking</text>
        <text class="content" x="32" y="384">Model hooks can veto deletion or restoration</text>
    </g>

    <g>
        <rect class="box-bg" x="16" y="416" width="588" height="84" rx="6"/>
        <rect x="16" y="416" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="442">PHP 8.3+</text>
        <text class="content" x="32" y="466">Supports Yii 2.0.55 and Yii 22.0</text>
        <text class="content" x="32" y="484">Works with PHP 8.3 or later</text>
    </g>

    <g>
        <rect class="box-bg" x="16" y="516" width="588" height="84" rx="6"/>
        <rect x="16" y="516" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="542">Verification</text>
        <text class="content" x="32" y="566">SQLite, MySQL, PostgreSQL, SQL Server and Oracle</text>
        <text class="content" x="32" y="584">Each suite runs on Yii 2.0.55 and Yii 22.0</text>
    </g>
</svg>
