---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: mutation test

permissions:
  contents: read

jobs:
  mutation:
    strategy:
      fail-fast: false
      matrix:
        yii: ["2.0.55", "22.0.x-dev"]
    uses: yii2-framework/actions/.github/workflows/infection.yml@1a1132f393d2572abaf9cc1fe75c5c86fce8c211 # v2.0.8
    with:
      composer-command: update --with yiisoft/yii2:${{ matrix.yii }}
      concurrency-group: mutation-${{ matrix.yii }}-${{ github.workflow }}-${{ github.ref }}
      extensions: bcmath, dom, intl, mbstring, openssl, sodium, pdo_sqlite, zip
      command-options: --threads=max --with-uncovered
    secrets:
      STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
