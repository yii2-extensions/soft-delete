---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: build-mssql

permissions:
  contents: read

jobs:
  mssql:
    name: SQL Server tests with Yii ${{ matrix.yii }}.
    strategy:
      fail-fast: false
      matrix:
        yii: ["2.0.55", "22.0.x-dev"]
    uses: yii2-framework/actions/.github/workflows/phpunit-database.yml@1a1132f393d2572abaf9cc1fe75c5c86fce8c211 # v2.0.8
    with:
      composer-command: require yiisoft/yii2:${{ matrix.yii }}
      coverage-driver: none
      concurrency-group: mssql-${{ matrix.yii }}-${{ github.ref }}
      database-env: |
        {
          "ACCEPT_EULA": "Y",
          "SA_PASSWORD": "YourStrong!Passw0rd",
          "MSSQL_PID": "Developer"
        }
      database-health-cmd: "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U SA -P 'YourStrong!Passw0rd' -Q 'SELECT 1'"
      database-health-retries: 5
      database-image: mcr.microsoft.com/mssql/server
      database-port: 1433
      database-type: mssql
      database-versions: '["2022-latest"]'
      enable-concurrency: true
      extensions: dom, mbstring, pdo, pdo_sqlite, pdo_sqlsrv, sqlsrv, sodium
      ignore-platform-reqs-php-version: "[8.6]"
      os: '["ubuntu-latest"]'
      php-version: "[8.3, 8.6]"
      phpunit-group: mssql
      setup-commands: |
        # Install Microsoft ODBC Driver for SQL Server
        sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

        # Wait for SQL Server to be fully ready
        sleep 15

        # Create test database
        docker exec -i "database-${GITHUB_RUN_ID}" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U SA -P 'YourStrong!Passw0rd' -Q "
        IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = 'yiitest')
        BEGIN
            CREATE DATABASE yiitest;
        END
        "
