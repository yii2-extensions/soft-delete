---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: build-oracle

permissions:
  contents: read

jobs:
  oracle:
    name: Oracle tests with Yii ${{ matrix.yii }}.
    strategy:
      fail-fast: false
      matrix:
        yii: ["2.0.55", "22.0.x-dev"]
    uses: yii2-framework/actions/.github/workflows/phpunit-database.yml@1a1132f393d2572abaf9cc1fe75c5c86fce8c211 # v2.0.8
    with:
      composer-command: require yiisoft/yii2:${{ matrix.yii }}
      coverage-driver: none
      concurrency-group: oracle-${{ matrix.yii }}-${{ github.ref }}
      database-env: |
        {
          "ORACLE_PASSWORD": "root"
        }
      database-health-cmd: "healthcheck.sh"
      database-health-retries: 10
      database-image: gvenzl/oracle-free
      database-port: 1521
      database-type: oci
      database-versions: '["23"]'
      enable-concurrency: true
      extensions: dom, mbstring, pdo, pdo_oci, pdo_sqlite, sodium
      ignore-platform-reqs-php-version: "[8.6]"
      os: '["ubuntu-latest"]'
      php-version: "[8.3, 8.6]"
      phpunit-group: oci
